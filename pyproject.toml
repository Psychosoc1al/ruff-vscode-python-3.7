[project]
name = "ruff-vscode"
version = "2026.86.0"
requires-python = ">=3.7.9"
dependencies = ["ruff==0.17.0"]

[tool.uv]
exclude-newer = "P7D"
# Release automation intentionally tracks the latest Ruff.
exclude-newer-package = { ruff = false }

[tool.ruff]
line-length = 88
target-version = "py37"
extend-exclude = ["bundled/libs", "src/testFixture"]

[tool.ruff.lint]
select = ["E", "F", "W", "Q", "UP", "I", "N"]

[tool.mypy]
files = ["bundled/tool", "build", "tests"]
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["debugpy.*", "lsprotocol.*", "pygls.*", "pylsp_jsonrpc.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy==1.2.0",
    "ruff>=0.16.2",
    # These require Python 3.8+:
    # "ty>=0.0.69", 
    # "uv>=0.12.3",
]
