[project]
name = "ruff-vscode"
version = "2026.78.0"
requires-python = ">=3.7.9"
dependencies = ["packaging>=23.1", "ruff-lsp==0.0.62", "ruff==0.16.6"]

[tool.uv]
exclude-newer = "P7D"
# Release automation intentionally tracks the latest Ruff and ruff-lsp.
exclude-newer-package = { ruff = false, ruff-lsp = false }
# ruff-lsp 0.0.62 imports APIs that were removed in newer releases.
constraint-dependencies = ["lsprotocol==2023.0.0", "pygls==1.2.1"]

[tool.ruff]
line-length = 88
target-version = "py37"
extend-exclude = ["bundled/libs", "src/testFixture"]

[tool.ruff.lint]
select = ["E", "F", "W", "Q", "UP", "I", "N"]

[tool.mypy]
files = ["bundled/tool", "build", "tests"]
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["debugpy.*", "lsprotocol.*", "pygls.*", "pylsp_jsonrpc.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy==1.2.0",               # `ty` requires Python 3.8+
    "python-lsp-jsonrpc==1.0.0",
]
